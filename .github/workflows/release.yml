name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # sign the build-provenance attestation
  attestations: write # store the attestation

jobs:
  release:
    # Apple Silicon runner; the app targets arm64 only.
    runs-on: macos-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Read release notes
        id: notes
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo "body<<NOTES_EOF"
            if [ -f "$file" ]; then cat "$file"; else echo "See the commit history for changes."; fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Yaptic ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          uploadUpdaterJson: false

      - name: Write checksums
        working-directory: src-tauri/target/release/bundle/dmg
        run: |
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt --clobber
